[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-embedding-comparison"
version = "0.1.0"
description = "BERTopic experiments comparing S-BERT and LLaMA pooling strategies"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[project.scripts]
topic-experiment = "topic_embedding.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
